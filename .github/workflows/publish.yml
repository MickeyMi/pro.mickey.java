name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '版本，例如 v0.72.0；留空使用最新版本'
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          latest=$(gh api repos/fatedier/frp/releases/latest --jq .tag_name)
          version=${REQUESTED_VERSION:-$latest}
          version=v${version#v}
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tags="$image:$version"
          if [[ "$version" == "$latest" ]]; then tags="$tags,$image:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            current=$(docker buildx imagetools inspect "$image:$version" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            published=$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [[ -n "$current" && "$current" == "$published" ]]; then
              echo 'skip=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        if: steps.version.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}
          push: true
          provenance: false
          sbom: false
