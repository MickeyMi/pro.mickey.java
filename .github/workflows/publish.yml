name: Build and publish frps-custom

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '稳定版本（v0.72.0 或 0.72.0）；留空使用上游最新稳定版'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Serialize default-branch publications so an old run cannot overwrite a newer run.
concurrency:
  group: frps-custom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      base: ${{ steps.release.outputs.base }}
      image: ${{ steps.release.outputs.image }}
      tags: ${{ steps.release.outputs.tags }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release-selection logic
        run: python3 -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to inspect existing private packages
        if: github.event_name == 'schedule'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve stable release and upstream digest
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        run: python3 scripts/resolve.py

  test:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build native test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: frps-custom:test
          build-args: |
            FRPS_VERSION=${{ needs.resolve.outputs.version }}
            FRPS_BASE=${{ needs.resolve.outputs.base }}
          cache-from: type=gha,scope=frps-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frps-${{ matrix.arch }}
      - name: Verify version, process name, config, listening port and shutdown
        env:
          FRPS_VERSION: ${{ needs.resolve.outputs.version }}
        run: python3 scripts/smoke.py frps-custom:test "$FRPS_VERSION"

  publish:
    needs: [resolve, test]
    if: >-
      needs.resolve.outputs.build == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both architectures
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.resolve.outputs.tags }}
          build-args: |
            FRPS_VERSION=${{ needs.resolve.outputs.version }}
            FRPS_BASE=${{ needs.resolve.outputs.base }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=frps-amd64
            type=gha,scope=frps-arm64
          provenance: mode=min
          sbom: true
      - name: Verify published index
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          TAGS: ${{ needs.resolve.outputs.tags }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from resolve import check_platforms, inspect_image, manifest_digest
          image = os.environ['IMAGE']
          digest = os.environ['DIGEST']
          check_platforms(inspect_image(image + '@' + digest))
          for tag in os.environ['TAGS'].split(','):
              if manifest_digest(inspect_image(tag)) != digest:
                  raise RuntimeError('发布后的标签摘要不一致: ' + tag)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Published: `' + image + '@' + digest + '`\n\n')
              summary.write('Platforms: `linux/amd64`, `linux/arm64`\n\n')
              summary.write('Tags: ' + os.environ['TAGS'] + '\n')
          PY
